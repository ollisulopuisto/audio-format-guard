name: Build Audio Format Guard

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release executable
        run: swift build -c release
      - name: Build app bundle
        run: ./build-app.sh
