name: Build Audio Format Guard

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Package macOS Binary
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run unit tests
        run: swift test

      - name: Import Developer ID certificate
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/audio-format-guard-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'

      - name: Build Developer ID signed universal artifacts
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: ./build-app.sh --universal --zip

      - name: Build ad-hoc signed universal artifacts
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
        run: ./build-app.sh --universal --zip

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/audio-format-guard-signing.keychain-db" || true

      - name: Verify binary architectures
        run: |
          file dist/AudioFormatGuard
          file "dist/Audio Format Guard.app/Contents/MacOS/AudioFormatGuard"

      - name: Stage artifacts
        run: |
          mkdir -p dist/artifacts
          cp dist/AudioFormatGuard dist/artifacts/AudioFormatGuard
          cp dist/AudioFormatGuard.zip dist/artifacts/AudioFormatGuard.zip
          cp unquarantine.command dist/artifacts/unquarantine.command
          (cd dist && zip -9 artifacts/AudioFormatGuard-binary.zip AudioFormatGuard unquarantine.command)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AudioFormatGuard-macos
          path: |
            dist/artifacts/*

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/artifacts/AudioFormatGuard
            dist/artifacts/AudioFormatGuard.zip
            dist/artifacts/AudioFormatGuard-binary.zip
            dist/artifacts/unquarantine.command
          generate_release_notes: true

